[package]
name = "lepao-poju"
version = "1.1.1"
description = "不道乐跑桌面版"
authors = ["Lepao Poju"]
edition = "2021"

[build-dependencies]
serde = { version="1", features= ["derive"] }
url = "2"
serde_json = "1"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
semver = "1"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
md-5 = "0.10"
base64 = "0.22"
url = "2"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
httpdate = "1"
regex = "1"
tokio = {version = "1", features = ["time", "sync"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"

[[bin]]
name = "budao-lepao"
path = "src/main.rs"
