<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="/frontend/css/tokens.css"><link rel="stylesheet" href="/frontend/css/app.css"><link rel="stylesheet" href="/frontend/preview.css"><title>本地地图布局回归 · 模拟数据</title></head><body><main id="stage"></main><script type="module">
import {autoRoute} from '/frontend/js/auto-route.js';
import {RouteEditorMap,TrackMap} from '/frontend/js/map.js';
const query=new URLSearchParams(location.search),view=query.get('view')||'preview',count=Number(query.get('n'))||28;
const checkpoint=i=>({id:i===11?'7682':`point-${i}`,point:[28+(i%7)*.001,112+Math.floor(i/7)*.001]});
const order=Array.from({length:count},(_,i)=>checkpoint(i));
const result={points:[[28,112],[28.005,112],[28.005,112.005],[28,112]],roadSegments:[[[28,112],[28.005,112],[28.005,112.005],[28,112]]],coverage:order.map((cp,i)=>({...cp,distanceM:i===11?59.4:3.2,radiusM:30,radiusSource:'local_default',covered:i!==11})),order,distanceM:6361,covered:count-1,canApply:false,fenceAvailable:true,fence:[],outsideSegments:[],continuous:true,requestCount:count+1,cacheHits:0};
window.__TAURI__={core:{invoke:async(cmd)=>{if(cmd==='map_config')return {jsApiKey:'synthetic',securityJsCode:'synthetic'};if(cmd==='route_plan')return result;if(cmd==='route_plan_cancel')return;if(cmd==='route_plan_status')return {phase:'查询道路',completed:count,total:count,requests:count+1,cacheHits:0};throw Error('Unexpected test operation');}}};
window.layoutRecords=[];
class MockMap{constructor(el,options){this.el=el;this.options=options;this.handlers={};this.center=options.center;el.style.position='relative';const r=el.getBoundingClientRect();window.layoutRecords.push({width:r.width,height:r.height,position:getComputedStyle(el).position});el.style.backgroundImage='linear-gradient(0deg,transparent 95%,#cbd5e1 95%),linear-gradient(90deg,transparent 95%,#cbd5e1 95%)';el.style.backgroundSize='40px 40px';queueMicrotask(()=>this.handlers.complete?.());}on(n,f){this.handlers[n]=f;}setStatus(){}setZoomAndCenter(z,p){this.center=p;}setBounds(){}getCenter(){return this.center;}setCenter(c){this.center=c;}resize(){}destroy(){}containerToLngLat(){return{getLat:()=>28,getLng:()=>112};}}
class MockOverlay{constructor(opts){this.options=opts;}setMap(){}getContent(){return this.options.content;}}
window.AMapLoader={load:async()=>({Map:MockMap,Bounds:class{},Pixel:class{},Polyline:MockOverlay,Polygon:MockOverlay,Marker:MockOverlay,CircleMarker:MockOverlay})};
if(view==='preview'){autoRoute({refresh:async()=>{}});}else if(view==='sidebar'){const aside=document.createElement('aside');aside.className='app-aside';aside.innerHTML='<div class=map style="height:240px"></div>';document.querySelector('#stage').appendChild(aside);window.rebuildMap=()=>{window.layoutMap?.destroy();window.layoutMap=new TrackMap(aside.firstElementChild,{track:result.points});};window.rebuildMap();}else if(view==='console'){const el=document.createElement('div');el.className='map';el.style.height='240px';document.querySelector('#stage').appendChild(el);window.layoutMap=new TrackMap(el,{track:result.points});}else{
 const editor=view==='editor';document.querySelector('#stage').innerHTML=`<div class="fullpage"><div class="fullpage-head"><span class="fullpage-title">${editor?'手绘路线布局测试':'记录详情布局测试'}</span></div><div class="fullpage-body split ${editor?'route-editor-layout':''}"><div class="map-wrap"><div class="map map-fill"></div></div><div class="fullpage-panel"><div class="card"><div class="card-body">模拟操作面板</div></div></div></div><div class="fullpage-foot"><button class="btn">取消</button><button class="btn btn-primary">保存</button></div></div>`;
 const el=document.querySelector('.map-fill');window.layoutMap=editor?new RouteEditorMap(el,{points:result.points}):new TrackMap(el,{track:result.points});
}
window.layoutReady=true;
</script></body></html>
